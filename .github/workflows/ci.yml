name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    name: Unit + typecheck + build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: umo
          POSTGRES_PASSWORD: umo
          POSTGRES_DB: umo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U umo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # deixa os testes de servidor/migrações rodarem contra Postgres real
      UMO_TEST_DATABASE_URL: postgres://umo:umo@localhost:5432/umo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck (app + servidor)
        run: npx tsc --noEmit && npm run typecheck:server
      - name: Testes unitários (vitest, inclui servidor WS + migrações)
        run: npx vitest run
      - name: Build de produção
        run: npm run build

  e2e:
    name: e2e (Playwright/Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npx playwright test
